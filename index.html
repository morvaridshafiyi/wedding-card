<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5ebe0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>دعوتنامه · Morvarid & Dariush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="assets/gates.jpg" as="image" />
    <link rel="preload" href="assets/couple-stamp.jpg" as="image" />
    <link rel="preload" href="assets/invitation-card.jpg" as="image" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="invitation" aria-hidden="true">
        <div class="invitation__frame">
          <img
            class="invitation__bg"
            src="assets/invitation-card.jpg"
            alt=""
            aria-hidden="true"
          />
          <div class="invitation__overlay">
            <div class="invitation__content">
              <div class="invitation__names" aria-label="Morvarid and Dariush">
                <span class="invitation__name">Morvarid</span>
                <span class="invitation__and">&</span>
                <span class="invitation__name">Dariush</span>
              </div>

              <p class="invitation__message">
                کنارمان باشید، در شبی که تمامِ فرداهای ما از آن آغاز می‌شود
              </p>

              <div class="invitation__details" dir="ltr">
                <div class="invitation__venue-wrap">
                  <span class="invitation__venue">عمارت رزا</span>
                  <div class="invitation__maps">
                    <a
                      class="invitation__map-link"
                      href="https://nshn.ir/0e_bvchs_xFOmP"
                      target="_blank"
                      rel="noopener noreferrer"
                      aria-label="موقعیت عمارت رزا در نشان"
                    >
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                          d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"
                        />
                      </svg>
                      <span>نشان</span>
                    </a>
                    <a
                      class="invitation__map-link"
                      href="https://balad.ir/directions/driving?origin=51.162449%2C35.664955&destination=51.336422243565075%2C35.71113564057849#10.44/35.6822/51.2527"
                      target="_blank"
                      rel="noopener noreferrer"
                      aria-label="مسیریابی به عمارت رزا در بلد"
                    >
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                          d="M12 2a1 1 0 0 1 1 1v2.07a7.002 7.002 0 0 1 5.93 5.93H21a1 1 0 1 1 0 2h-2.07A7.002 7.002 0 0 1 13 18.93V21a1 1 0 1 1-2 0v-2.07A7.002 7.002 0 0 1 5.07 13H3a1 1 0 1 1 0-2h2.07A7.002 7.002 0 0 1 11 5.07V3a1 1 0 0 1 1-1zm0 4a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"
                        />
                      </svg>
                      <span>بلد</span>
                    </a>
                  </div>
                </div>

                <div class="invitation__date">
                  <span class="invitation__date-ornament" aria-hidden="true">✦</span>
                  <span class="invitation__date-day">23</span>
                  <span class="invitation__date-divider" aria-hidden="true"></span>
                  <span class="invitation__date-meta">
                    <span class="invitation__date-month">مهر</span>
                    <span class="invitation__date-year">1405</span>
                  </span>
                  <span class="invitation__date-ornament invitation__date-ornament--bottom" aria-hidden="true">✦</span>
                </div>

                <div class="invitation__datetime">
                  <span class="invitation__weekday">پنج&zwnj;شنبه</span>
                  <span class="invitation__time">18:00</span>
                </div>
              </div>

              <p class="invitation__rsvp">
                مشتاق دیدارتان هستیم؛<br />
                اگر فرصت حضور نبود، لطفاً ما را مطلع کنید.
              </p>
            </div>
          </div>
        </div>

        <div class="pearls" aria-hidden="true">
          <span class="pearl pearl--1"></span>
          <span class="pearl pearl--2"></span>
          <span class="pearl pearl--3"></span>
          <span class="pearl pearl--4"></span>
          <span class="pearl pearl--5"></span>
          <span class="pearl pearl--6"></span>
          <span class="pearl pearl--7"></span>
          <span class="pearl pearl--8"></span>
          <span class="pearl pearl--9"></span>
          <span class="pearl pearl--10"></span>
        </div>
      </section>

      <div
        class="gates"
        id="gates"
        role="button"
        aria-label="برای باز کردن دعوتنامه لمس کنید"
        tabindex="0"
      >
        <div class="gates__stage">
          <div class="gate gate--left">
            <div class="gate__panel"></div>
            <div class="stamp">
              <div class="stamp__ring">
                <img
                  class="stamp__photo"
                  src="assets/couple-stamp.jpg"
                  alt=""
                />
              </div>
            </div>
          </div>
          <div class="gate gate--right">
            <div class="gate__panel"></div>
          </div>
        </div>
        <div class="gate__seam"></div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
