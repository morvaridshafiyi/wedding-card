<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5ebe0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>دعوتنامه · Morvarid & Dariush</title>
    <link rel="preload" href="assets/gates.jpg" as="image" />
    <link rel="preload" href="assets/couple-stamp.jpg" as="image" />
    <link rel="preload" href="assets/invitation-card.png" as="image" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="invitation" aria-hidden="true">
        <img
          class="invitation__card"
          src="assets/invitation-card.png"
          alt="دعوتنامه عروسی مروارید و داریوش"
        />
        <div class="pearls" aria-hidden="true">
          <span class="pearl pearl--1"></span>
          <span class="pearl pearl--2"></span>
          <span class="pearl pearl--3"></span>
          <span class="pearl pearl--4"></span>
          <span class="pearl pearl--5"></span>
          <span class="pearl pearl--6"></span>
          <span class="pearl pearl--7"></span>
          <span class="pearl pearl--8"></span>
          <span class="pearl pearl--9"></span>
          <span class="pearl pearl--10"></span>
        </div>
      </section>

      <div
        class="gates"
        id="gates"
        role="button"
        aria-label="برای باز کردن دعوتنامه لمس کنید"
        tabindex="0"
      >
        <div class="gates__stage">
          <div class="gate gate--left">
            <div class="gate__panel"></div>
            <div class="stamp">
              <div class="stamp__ring">
                <img
                  class="stamp__photo"
                  src="assets/couple-stamp.jpg"
                  alt=""
                />
              </div>
            </div>
          </div>
          <div class="gate gate--right">
            <div class="gate__panel"></div>
          </div>
        </div>
        <div class="gate__seam"></div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
